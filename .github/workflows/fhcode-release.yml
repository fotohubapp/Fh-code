name: "FH Code: release"

# Publishes an FH Code release, which is the update channel installed copies
# check (fhcode update). To release: bump "version" in fhcode/package.json, merge,
# then push a tag fhcode-v<version>, e.g. fhcode-v0.2.0.

on:
  push:
    tags:
      - "fhcode-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fhcode
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Checkout the docs.fotohub.app source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: fotohubapp/docs
          path: docs-src
          persist-credentials: false

      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "fhcode-v$version" ]; then
            echo "Tag $TAG does not match fhcode/package.json version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Refresh the docs index from docs.fotohub.app
        run: node scripts/build-docs-index.mjs ../docs-src

      - name: Typecheck, build and test
        run: npm test

      - name: Pack
        run: |
          npm pack
          # A version-less copy, so releases/latest/download/fh-code.tgz always works.
          cp fh-code-*.tgz fh-code.tgz

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" fh-code-*.tgz fh-code.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "FH Code ${TAG#fhcode-v}" \
            --generate-notes

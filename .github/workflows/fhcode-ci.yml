name: "FH Code: CI"

on:
  pull_request:
    paths:
      - "fhcode/**"
      - "plugins/**"
      - ".github/workflows/fhcode-ci.yml"
  push:
    branches: [main]
    paths:
      - "fhcode/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fhcode
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Check the Node.js version
        run: |
          node --version
          case "$(node --version)" in v2[0-9]*) ;; *) echo "FH Code needs Node.js 20 or newer" >&2; exit 1;; esac

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The end-to-end test runs the real engine against a mock FOTOhub API;
      # it talks to no Anthropic service and needs no key.
      - name: Install the Claude Code engine
        run: npm install -g @anthropic-ai/claude-code

      - name: Typecheck, build and test
        run: npm test
